name: Docker

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  packages: read

jobs:
  simple_install:
    name: Simple Installation [${{ matrix.build-type }}]
    runs-on: ubuntu-22.04
    env:
      SAFE_UPDATE_TEST_IMAGE: ${{ vars.SAFE_UPDATE_TEST_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        build-type:
          # - enterprise
          - community

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Check update and MCP simple-install contracts
        run: npx --yes bats@1.12.0 tests/safe-update.bats tests/mcp-simple-install.bats

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Simple Install
        run: |
          docker compose -f docker-compose.simple-install.yml down 2>&1
          docker system prune --force --volumes --all
          
          # A released bridge-capable app image must be configured for this repository.
          # Never run a tag-only legacy startup against the new coordination contract.
          test -n "$SAFE_UPDATE_TEST_IMAGE"
          test -f .env || cp .env.example .env
          ERAMBA_MCP_DEV_BEARER_TOKEN=ci-mcp-smoke-token ./bin/eramba-update --install --image "$SAFE_UPDATE_TEST_IMAGE"

      - name: Wait for apache to start
        timeout-minutes: 5
        run: |
          until docker compose -f docker-compose.simple-install.yml exec -T --user www-data eramba curl --fail --silent http://localhost:80/hello.txt >/dev/null; do
            printf 'Waiting for Apache...\n'
            sleep 2
          done

      - name: HTTP Check
        run: |
          if curl -w '%{http_code}\n' -o /dev/null --silent --insecure https://localhost:8443/settings/test-public-address | grep 204; then
            exit 0
          else
            exit 1
          fi

      - name: MCP protocol check
        timeout-minutes: 5
        run: |
          until curl --fail --silent --insecure https://localhost:8443/openapi.json >/dev/null; do
            printf 'Waiting for MCP...\n'
            sleep 2
          done

          curl --fail --silent --insecure https://localhost:8443/.well-known/oauth-protected-resource/mcp \
            | jq -e '.resource == "https://localhost:8443/mcp"'

          curl --fail --silent --insecure https://localhost:8443/mcp \
            -H 'Authorization: Bearer ci-mcp-smoke-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"docker-ci","version":"1.0"}}}' \
            | jq -e '.result.protocolVersion == "2025-03-26"'

          curl --fail --silent --insecure https://localhost:8443/mcp \
            -H 'Authorization: Bearer ci-mcp-smoke-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | jq -e '.result.tools | length > 0'

      - name: CMD Check
        run: |
          if docker compose -f docker-compose.simple-install.yml exec -T -w /var/www/eramba/app/upgrade --user www-data eramba bin/cake current_config validate; then
            exit 0
          fi

          exit 1

      - name: System Health Check
        run: |
          if docker compose -f docker-compose.simple-install.yml exec -T -w /var/www/eramba/app/upgrade --user www-data eramba bin/cake system_health check; then
            exit 0
          fi
          
          exit 1

      - name: Migrations Status Check On CRON Container (to determine if DB connection is working)
        run: |
          if docker compose -f docker-compose.simple-install.yml exec -T -w /var/www/eramba/app/upgrade --user www-data cron bin/cake migrations status; then
            exit 0
          fi

          exit 1
