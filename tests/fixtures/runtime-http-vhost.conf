Alias /__safe-update/http.php /opt/eramba-safe-fixtures/db-http.php
<Directory /opt/eramba-safe-fixtures>
    AllowOverride None
    CGIPassAuth On
    Require all granted
</Directory>
<VirtualHost *:80 *:8080>
    DocumentRoot "/var/www/eramba"
    <Directory "/var/www/eramba">
        AllowOverride all
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443 *:8443>
    DocumentRoot "/var/www/eramba"
    <Directory "/var/www/eramba">
        AllowOverride all
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/mycert.crt
    SSLCertificateKeyFile /etc/ssl/private/mycert.key
</VirtualHost>
<VirtualHost *:8081>
    DocumentRoot "/var/www/eramba"
    SetEnv ERAMBA_PRIVATE_ORIGIN 1
    <Directory "/var/www/eramba">
        AllowOverride all
        Require all granted
    </Directory>
</VirtualHost>
