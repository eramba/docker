services:
  mysql:
    container_name: mysql
    image: mysql:8.4.3-oracle
    command: ["mysqld", "--disable-log-bin"]
    restart: always
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/entrypoint:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - app_internal
      - host_access
  redis:
    container_name: redis
    image: redis:7.4.2-alpine
    restart: always
    networks:
      - app_internal
  eramba:
    container_name: eramba
    image: ghcr.io/eramba/eramba:latest
    restart: always
    ports:
      - 8443:443
    volumes:
      - data:/var/www/eramba/app/upgrade/data
      - app:/var/www/eramba
      - logs:/var/www/eramba/app/upgrade/logs
      - ./apache/ssl/mycert.crt:/etc/ssl/certs/mycert.crt
      - ./apache/ssl/mycert.key:/etc/ssl/private/mycert.key
      - ./apache/security.conf:/etc/apache2/conf-available/security.conf
      - ./apache/ports.conf:/etc/apache2/ports.conf
      - ./apache/vhost-ssl.conf:/etc/apache2/sites-available/000-default.conf
      - ./crontab/crontab:/etc/cron.d/eramba-crontab
      - trigger-logs:/var/log/trigger-limits
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_URL: ${CACHE_URL}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS}
      USE_PROXY: ${USE_PROXY}
      PROXY_HOST: ${PROXY_HOST}
      PROXY_PORT: ${PROXY_PORT}
      USE_PROXY_AUTH: ${USE_PROXY_AUTH}
      PROXY_AUTH_USER: ${PROXY_AUTH_USER}
      PROXY_AUTH_PASS: ${PROXY_AUTH_PASS}
      TRIGGER_RUNNER_SHARED_SECRET: ${TRIGGER_RUNNER_SHARED_SECRET}
      DOCKER_DEPLOYMENT: ${DOCKER_DEPLOYMENT}
      LDAPTLS_REQCERT: ${LDAPTLS_REQCERT}
      OAUTH2_ENABLED: ${OAUTH2_ENABLED:-1}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-${PUBLIC_ADDRESS}}
      OAUTH2_RESOURCE: ${OAUTH2_RESOURCE:-${PUBLIC_ADDRESS}/mcp}
      OAUTH2_SCOPE: ${OAUTH2_SCOPE:-eramba.full_access}
      OAUTH2_AUTH_CODE_TTL: ${OAUTH2_AUTH_CODE_TTL:-120}
      OAUTH2_ACCESS_TOKEN_TTL: ${OAUTH2_ACCESS_TOKEN_TTL:-900}
      OAUTH2_REFRESH_TOKEN_TTL: ${OAUTH2_REFRESH_TOKEN_TTL:-2592000}
      OAUTH2_INTROSPECTION_CLIENT_ID: ${OAUTH2_INTROSPECTION_CLIENT_ID:-eramba-mcp-introspect}
      OAUTH2_INTROSPECTION_CLIENT_SECRET: ${OAUTH2_INTROSPECTION_CLIENT_SECRET:-Replace-this-with-a-secret}
    links:
      - mysql
      - redis
    depends_on:
      - mysql
    networks:
      - app_internal
      - triggers_net
  cron:
    container_name: cron
    image: ghcr.io/eramba/eramba:latest
    command: ["cron", "-f"]
    entrypoint: ["/docker-cron-entrypoint.sh"]
    restart: always
    volumes:
      - data:/var/www/eramba/app/upgrade/data
      - app:/var/www/eramba
      - logs:/var/www/eramba/app/upgrade/logs
      - ./docker-cron-entrypoint.sh:/docker-cron-entrypoint.sh
      - ./crontab/crontab:/etc/cron.d/eramba-crontab
      - .env:/var/www/docker.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_URL: ${CACHE_URL}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS}
      USE_PROXY: ${USE_PROXY}
      PROXY_HOST: ${PROXY_HOST}
      PROXY_PORT: ${PROXY_PORT}
      USE_PROXY_AUTH: ${USE_PROXY_AUTH}
      PROXY_AUTH_USER: ${PROXY_AUTH_USER}
      PROXY_AUTH_PASS: ${PROXY_AUTH_PASS}
      TRIGGER_RUNNER_SHARED_SECRET: ${TRIGGER_RUNNER_SHARED_SECRET}
      DOCKER_DEPLOYMENT: ${DOCKER_DEPLOYMENT}
      LDAPTLS_REQCERT: ${LDAPTLS_REQCERT}
      OAUTH2_ENABLED: ${OAUTH2_ENABLED:-1}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-${PUBLIC_ADDRESS}}
      OAUTH2_RESOURCE: ${OAUTH2_RESOURCE:-${PUBLIC_ADDRESS}/mcp}
      OAUTH2_SCOPE: ${OAUTH2_SCOPE:-eramba.full_access}
      OAUTH2_AUTH_CODE_TTL: ${OAUTH2_AUTH_CODE_TTL:-120}
      OAUTH2_ACCESS_TOKEN_TTL: ${OAUTH2_ACCESS_TOKEN_TTL:-900}
      OAUTH2_REFRESH_TOKEN_TTL: ${OAUTH2_REFRESH_TOKEN_TTL:-2592000}
      OAUTH2_INTROSPECTION_CLIENT_ID: ${OAUTH2_INTROSPECTION_CLIENT_ID:-eramba-mcp-introspect}
      OAUTH2_INTROSPECTION_CLIENT_SECRET: ${OAUTH2_INTROSPECTION_CLIENT_SECRET:-Replace-this-with-a-secret}
    links:
      - mysql
      - redis
      - eramba
    depends_on:
      - eramba
    networks:
      - app_internal
      - triggers_net
  triggers_caddy:
    image: ghcr.io/eramba/eramba-triggers:latest
    container_name: triggers_caddy
    entrypoint:
      - /app/iptables-entrypoint.sh
    volumes:
      - trigger-logs:/var/log/trigger-limits
      - trigger-storage:/data/eramba_trigger_storage
    depends_on:
      - eramba
    environment:
      CRON_HOST: cron
      TRIGGER_RUNNER_SHARED_SECRET: ${TRIGGER_RUNNER_SHARED_SECRET}
    cap_add:
      - NET_ADMIN
    networks:
      - triggers_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9001/health | grep -q '^200$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  mcp_server:
    image: ghcr.io/eramba/eramba-mcp-server:martin-plan-setup-upgrades
    container_name: mcp_server
    restart: always
    ports:
      - 13000:3000
    depends_on:
      - eramba
    environment:
      MCP_TRANSPORT: http
      PORT: 3000
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:13000}
      MCP_RESOURCE: ${MCP_RESOURCE:-http://localhost:13000/mcp}
      ERAMBA_BASE_URL: https://eramba
      ERAMBA_OAUTH_ISSUER: ${OAUTH2_ISSUER:-${PUBLIC_ADDRESS}}
      ERAMBA_OAUTH_INTROSPECTION_URL: ${ERAMBA_OAUTH_INTROSPECTION_URL:-https://eramba/oauth2/introspect}
      ERAMBA_OAUTH_INTROSPECTION_CLIENT_ID: ${OAUTH2_INTROSPECTION_CLIENT_ID:-eramba-mcp-introspect}
      ERAMBA_OAUTH_INTROSPECTION_CLIENT_SECRET: ${OAUTH2_INTROSPECTION_CLIENT_SECRET:-Replace-this-with-a-secret}
      MCP_REQUIRED_SCOPE: ${OAUTH2_SCOPE:-eramba.full_access}
      ERAMBA_INSECURE_TLS: 1
      ERAMBA_REQUEST_TIMEOUT_MS: 15000
    networks:
      - app_internal
      - host_access
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/openapi.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  public_proxy:
    container_name: public_proxy
    image: caddy:2.8-alpine
    ports:
      - 8088:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      MCP_UPSTREAM: mcp_server:3000
      ERAMBA_UPSTREAM: https://eramba:443
    depends_on:
      - eramba
      - mcp_server
    networks:
      - app_internal
      - host_access
volumes:
  app:
  data:
  logs:
  db-data:
  trigger-logs:
  trigger-storage:
networks:
  app_internal:
    internal: true
  triggers_net:
  host_access:
